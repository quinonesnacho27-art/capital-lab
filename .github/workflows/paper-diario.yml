name: Paper trading diario

# De martes a sábado (después del cierre de EEUU) re-corre la simulación de
# paper trading, actualiza el journal y el dashboard. Todo simulado: este
# workflow no tiene credenciales de ningún bróker porque no las necesita.

on:
  schedule:
    # 22:30 UTC ≈ 1-2 horas después del cierre de Wall Street.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capital-lab-paper
  cancel-in-progress: false

jobs:
  simular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el paper trading
        run: python main_paper.py

      - name: Guardar journal y dashboard en el repo
        run: |
          git config user.name  "capital-lab[bot]"
          git config user.email "actions@github.com"
          git add paper/registro site/paper.js
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Paper trading del $(date -u +%Y-%m-%d)"
            git push
          fi
