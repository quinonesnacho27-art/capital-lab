name: Publicar la web

# Publica la carpeta site/ en GitHub Pages. Va separado de la simulación
# semanal a propósito: la web sigue disponible aunque la corrida falle
# (por ejemplo si Yahoo Finance cambia algo). Cada vez que el job semanal
# commitea site/data.js, este workflow se dispara solo.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
