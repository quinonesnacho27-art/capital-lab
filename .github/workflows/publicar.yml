name: Publicar la web

# Publica la carpeta site/ en GitHub Pages. Va separado de la simulación
# semanal a propósito: la web sigue disponible aunque la corrida falle
# (por ejemplo si Yahoo Finance cambia algo). Cada vez que el job semanal
# o el bot commitean algo en site/, este workflow se dispara solo.
#
# Dos jobs (construir -> desplegar), como la plantilla oficial de GitHub:
# con ambos pasos en el mismo job, deploy-pages a veces busca el artefacto
# antes de que GitHub lo registre y falla con "No artifacts named
# github-pages" (actions/deploy-pages#451; desde nov-2026 fallaba siempre).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
